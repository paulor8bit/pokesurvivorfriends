<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; frame-src http://localhost:*; object-src 'none'; base-uri 'none'">
  <title>PokéSurvivor</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <header>
    <div class="brand"><img src="../assets/icons/icon-48.png" alt=""><div><strong>PokéSurvivor Online</strong><small>Paulinho Ricardo · gatinho.punkeca</small></div></div>
    <div id="connection" class="connection" role="status" aria-live="polite"><i id="dot"></i><span id="status">Abrindo o jogo…</span></div>
    <button id="retry" hidden>Tentar novamente</button>
    <button id="copy-site" disabled>Copiar site</button>
  </header>
  <main>
    <div id="loading"><img src="../assets/icons/icon-192.png" alt=""><h1>Preparando sua aventura…</h1><p>Sem login. Seu progresso fica salvo neste aplicativo.</p></div>
    <iframe id="game" title="PokéSurvivor" allow="clipboard-write; fullscreen; gamepad" allowfullscreen hidden></iframe>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
